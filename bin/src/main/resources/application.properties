# Application name
spring.application.name=Spring Boot Tasks Restful API-Demo-1


# Spring Security disabled in dev env.
# Set 'prod' to enable Spring Security
spring.profiles.active=dev

# Redis configuration
spring.data.redis.host=localhost
spring.data.redis.port=6379

# DataSource configuration for MySQL
# Notes: The setting 'allowPublicKeyRetrieval=true&useSSL=false' should only 
# be used for local development or testing purposes, not in production.
spring.datasource.url=jdbc:mysql://localhost:3306/devdb?
spring.datasource.username=root
spring.datasource.password=Welc@23MySQL
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
server.port=8080

# HikariCP settings
# Adjust these settings based on applications load and  
# behavior,and monitor the impact of any changes.
# 30000 ==> 30 seconds, 300000 ==> 5 minutes, 1800000 ==> 30 minutes
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=1800000

# Hibernate log its connection metadata (URL, driver, isolation, etc.)
spring.jpa.properties.hibernate.connection.url=${spring.datasource.url}
spring.jpa.properties.hibernate.connection.username=${spring.datasource.username}
spring.jpa.properties.hibernate.connection.password=${spring.datasource.password}
spring.jpa.properties.hibernate.connection.autocommit=false
spring.jpa.properties.hibernate.connection.isolation =TRANSACTION_REPEATABLE_READ
spring.jpa.properties.hibernate.connection.pool_size =${spring.datasource.hikari.maximum-pool-size}
 

# Hibernate DDL auto configuration
spring.jpa.hibernate.ddl-auto=update
# Hibernate Dialect for MySQL
# spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Show SQL queries in the console
spring.jpa.show-sql=true

